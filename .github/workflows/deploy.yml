name: Deploy to Production

# Production only. Runs on main, never on a pull request.
#
# This used to run `build:preview` (VERIFY_RELAX=1), which disabled the
# content-integrity gate entirely — the live site shipped unverified data and
# the gate protected nothing. It now runs the real build with an EXPLICIT
# acknowledgement list, so a new placeholder cannot slip in unnoticed.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      # Gates run BEFORE the build so a failure is reported as what it is.
      #
      # Data schema FIRST: it is the cheapest check and the one a CMS commit is
      # most likely to fail. Letting the build catch a malformed manifest by
      # throwing on import would report it as a stack trace from inside
      # `astro build`, which is exactly what this named step exists to avoid.
      - name: Data schema (CMS-writable JSON)
        run: npm run lint:data
      - name: Medical claims linter
        run: npm run lint:claims
      - name: Mixed-script linter
        run: npm run lint:scripts
      - name: Asset guard (tracked media)
        run: npm run lint:assets
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test

  # verify, build and the browser QA run IN PARALLEL; deploy waits for all
  # three. Every gate still blocks the deploy — only the waiting in between
  # is gone. (Serially this took ~4.3 min per doctor save; 2026-09-30.)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci

      - name: Build (strict launch gate)
        env:
          NODE_ENV: production
          ASTRO_SITE: https://www.drkhalilkanani.com
          ASTRO_BASE: /
          # ── ACKNOWLEDGED UNVERIFIED FIELDS ──────────────────────────────
          # Each entry is a value that IS displayed but has not been confirmed
          # by the clinic owner. Shipping them is a conscious decision, not an
          # accident. Any OTHER unverified published field fails this build.
          #
          #   doctor.ar   Arabic spelling inferred from the Hebrew
          #   doctor.en   Latin transliteration not yet fixed by the owner
          #   tagline.ar  Arabic translation needs native review
          #
          # Remove entries as they are verified. Do not add without a reason.
          ACK_UNVERIFIED: 'doctor.ar,tagline.ar'
        run: npm run build

      # Runs on dist/, so it checks what visitors actually receive. Heading
      # order is AA-mandatory in Israel (IS 5568 promotes WCAG 2.4.10), so
      # this blocks the deploy rather than warning.
      - name: Accessibility audit (built HTML)
        run: npm run lint:a11y

      # Crawls dist/ the way a search engine crawls the live site: robots,
      # sitemap, canonical, hreflang, noindex, JSON-LD origin, internal links.
      # Every CMS save passes through here, so a content edit cannot quietly
      # de-index a page or break a language cluster.
      - name: SEO crawl (built site)
        run: npm run lint:seo

      # Before the deploy, the live site still shows the previous build, so
      # this is the one moment "what changed" can be computed exactly.
      # Never blocks a deploy: search notification is a courtesy, not a gate.
      - name: IndexNow — list changed pages
        continue-on-error: true
        run: node scripts/indexnow.mjs changed --dist dist --out indexnow-urls.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare Pages files
        # build.txt names the exact commit this deployment contains. Edit
        # Mode reads it to say "Live" only when the official site really has
        # a saved change — never merely because a workflow finished.
        run: |
          touch ./dist/.nojekyll
          echo "$GITHUB_SHA" > ./dist/build.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # The Playwright suite, split across two machines. It builds the same
  # commit itself (the preview server serves dist/); a shard failing blocks
  # the deploy exactly as the single job did.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build (strict launch gate)
        env:
          NODE_ENV: production
          ASTRO_SITE: https://www.drkhalilkanani.com
          ASTRO_BASE: /
          ACK_UNVERIFIED: 'doctor.ar,tagline.ar'
        run: npm run build
      - name: Install browser for QA
        run: npx playwright install --with-deps chromium
      - name: Browser QA (three locales, responsive layouts, axe and contact flow)
        run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-browser-qa-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [verify, build, e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # After the deploy: tell IndexNow engines (Bing and partners) which pages
  # changed — only once the live site really serves this commit.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: IndexNow — notify
        run: node scripts/indexnow.mjs submit --list indexnow-urls.txt --expect "$GITHUB_SHA"
